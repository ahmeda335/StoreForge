# Twelve-factor configuration: every environment-specific value has an env-var override.
# Defaults target the local Docker Compose setup (see docs/infrastructure/local-development.md).
spring:
  application:
    name: storeforge
  threads:
    virtual:
      enabled: true

  # Runtime connection: the least-privileged app role (DML only, cannot change the schema).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storeforge}
    username: ${DB_APP_USER:storeforge_app}
    password: ${DB_APP_PASSWORD:storeforge_app_dev}
    hikari:
      pool-name: storeforge-app
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast when the pool is exhausted or the DB is down, instead of hanging requests.
      connection-timeout: 3000
      validation-timeout: 1000

  # Migrations run as the schema owner, a separate role from the runtime one.
  flyway:
    user: ${DB_OWNER_USER:storeforge_owner}
    password: ${DB_OWNER_PASSWORD:storeforge_owner_dev}
    default-schema: storeforge
    schemas: storeforge
    create-schemas: false
    placeholders:
      app_role: ${DB_APP_USER:storeforge_app}

  jpa:
    open-in-view: false          # no lazy loading during view rendering; transactions end in the service layer
    properties:
      hibernate:
        jdbc:
          batch_size: 50         # insert a product's variants in batches, not one round trip each
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: validate         # Flyway owns the schema; Hibernate only checks the mapping matches it

  jackson:
    deserialization:
      fail-on-unknown-properties: true   # a typo'd field is a client bug: reject it (400) instead of ignoring it

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 2000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false   # API-only service: unknown paths are 404 problems, not static-file lookups

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

# OpenAPI document of the DEVELOPER API only (the admin API is for our own frontend):
# GET /developer/openapi (public, outside /api/** so no credential is needed to read it).
springdoc:
  api-docs:
    path: /developer/openapi
  paths-to-match: /api/**
  default-produces-media-type: application/json

# JDBC spans (datasource-micrometer): connection acquisition and queries; never parameter values.
jdbc:
  includes: connection, query
  datasource-proxy:
    include-parameter-values: false

storeforge:
  jobs:
    poll-interval: ${JOBS_POLL_INTERVAL:500ms}
    batch-size: 50
    concurrency: ${JOBS_CONCURRENCY:8}         # per instance; below the DB pool size (handlers use it briefly)
    type-concurrency:                          # bulkheads: slow kinds of work can't take every slot
      "[webhooks.deliver]": 4
    lease: 60s
    max-attempts: 10
    backoff-base: 5s
    backoff-cap: 1h
    retention: 7d
  redis:
    url: ${REDIS_URL:redis://localhost:6379}
    command-timeout: 250ms        # fail fast: the caller has a fallback
    reconnect-backoff: 5s
  developer:
    per-credential:               # token bucket per API key / installation
      capacity: 40                #   burst
      refill-per-second: 2        #   sustained
    per-store:                    # all credentials of one store together
      capacity: 100
      refill-per-second: 5
    max-api-keys-per-store: 25
    usage-retention-in-redis: 3d
  webhooks:
    api-version: "2026-10"
    max-subscriptions-per-store: 20
    connect-timeout: 2s
    request-timeout: 10s
    retry-schedule: 1m, 5m, 30m, 2h, 6h, 12h, 24h, 24h   # 9 attempts over ~70 h
    max-attempts: 9
    max-attempts-on-client-error: 3
    pause-after-consecutive-failures: 20
    max-connections-per-endpoint: 4
    secret-overlap: 24h
    retention: 30d
    response-excerpt-bytes: 512
    # base64 of 32 random bytes encrypting signing secrets at rest. This value is for LOCAL DEVELOPMENT only.
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY:uJpdIXQiVMWS3GxRYbhcbQPA/RSV8pSJsHcBn1vA/0M=}
    require-https: ${WEBHOOKS_REQUIRE_HTTPS:true}
    # SSRF escape hatch for local receivers, e.g. 127.0.0.0/8. Never in production.
    allowed-private-cidrs: ${WEBHOOKS_ALLOWED_PRIVATE_CIDRS:}
  payments:
    provider: ${PAYMENTS_PROVIDER:fake}
    webhook-tolerance: 5m
    refund-retry-delay: 30s
    reconciliation:
      interval: ${PAYMENTS_RECONCILIATION_INTERVAL:5m}
      stale-after: ${PAYMENTS_STALE_AFTER:10m}
      provider-event-retention: 30d
    circuit-breaker:
      failure-rate-threshold: 50     # percent of the last sliding-window calls
      sliding-window: 20
      minimum-calls: 10
      open-for: 30s
    fake:
      webhook-secret: ${FAKE_PROVIDER_WEBHOOK_SECRET:whsec_fake_local_development_only}
      # Where the fake provider POSTs its webhooks (like Stripe would). Blank: not delivered (tests deliver them).
      webhook-url: ${FAKE_PROVIDER_WEBHOOK_URL:http://localhost:8080/webhooks/v1/payments/fake}
    stripe:
      base-url: ${STRIPE_BASE_URL:https://api.stripe.com}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-version: ${STRIPE_API_VERSION:}
      connect-timeout: 2s
      read-timeout: 10s
  orders:
    payment-window: ${ORDER_PAYMENT_WINDOW:15m}
    reservation-grace: 15m
    expiry-interval: ${ORDER_EXPIRY_INTERVAL:30s}
  inventory:
    sweeper:
      interval: ${INVENTORY_SWEEPER_INTERVAL:30s}
  stores:
    platform-domain: ${PLATFORM_DOMAIN:storeforge.localhost}
    invitation-ttl: 7d
    app-base-url: ${APP_BASE_URL:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:StoreForge <no-reply@storeforge.localhost>}
  auth:
    issuer: ${AUTH_ISSUER:https://storeforge.localhost}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    # Private EC P-256 JWK (JSON). Blank -> ephemeral key, allowed only while allow-ephemeral-signing-key=true.
    signing-jwk: ${AUTH_SIGNING_JWK:}
    previous-public-jwks: ${AUTH_PREVIOUS_PUBLIC_JWKS:}
    allow-ephemeral-signing-key: ${AUTH_ALLOW_EPHEMERAL_SIGNING_KEY:true}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:4200}
    app-base-url: ${APP_BASE_URL:http://localhost:4200}
    lockout:
      threshold: 5
      base-duration: 1m
      max-duration: 1h
    rate-limits:
      per-ip: ${AUTH_RATE_LIMIT_PER_IP:30}
      per-email: ${AUTH_RATE_LIMIT_PER_EMAIL:10}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        environment: ${ENVIRONMENT:local}

# Operational endpoints live on a separate port that is never exposed publicly.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, jobs
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness = the process works. Deliberately NOT the database: a DB outage must not make
        # the orchestrator restart every instance (that turns an outage into a restart storm).
        liveness:
          include: livenessState
        # Readiness = can serve traffic now. A DB outage takes the instance out of rotation.
        readiness:
          include: readinessState, db
  health:
    mail:
      enabled: false   # an email outage must never take instances out of rotation
  info:
    env:
      enabled: false
  # Traces: every request is sampled locally; production lowers this (and tail-samples in the Collector).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: false        # turned on by the "otel" profile (application-otel.yml)
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false
  opentelemetry:
    resource-attributes:
      deployment.environment: ${ENVIRONMENT:local}
  metrics:
    tags:
      application: storeforge
    distribution:
      percentiles-histogram:
        http.server.requests: true
