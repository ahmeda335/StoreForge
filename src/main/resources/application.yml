# Twelve-factor configuration: every environment-specific value has an env-var override.
# Defaults target the local Docker Compose setup (see docs/infrastructure/local-development.md).
spring:
  application:
    name: storeforge
  threads:
    virtual:
      enabled: true

  # Runtime connection: the least-privileged app role (DML only, cannot change the schema).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storeforge}
    username: ${DB_APP_USER:storeforge_app}
    password: ${DB_APP_PASSWORD:storeforge_app_dev}
    hikari:
      pool-name: storeforge-app
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast when the pool is exhausted or the DB is down, instead of hanging requests.
      connection-timeout: 3000
      validation-timeout: 1000

  # Migrations run as the schema owner, a separate role from the runtime one.
  flyway:
    user: ${DB_OWNER_USER:storeforge_owner}
    password: ${DB_OWNER_PASSWORD:storeforge_owner_dev}
    default-schema: storeforge
    schemas: storeforge
    create-schemas: false
    placeholders:
      app_role: ${DB_APP_USER:storeforge_app}

  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false   # API-only service: unknown paths are 404 problems, not static-file lookups

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        environment: ${ENVIRONMENT:local}

# Operational endpoints live on a separate port that is never exposed publicly.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness = the process works. Deliberately NOT the database: a DB outage must not make
        # the orchestrator restart every instance (that turns an outage into a restart storm).
        liveness:
          include: livenessState
        # Readiness = can serve traffic now. A DB outage takes the instance out of rotation.
        readiness:
          include: readinessState, db
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: storeforge
    distribution:
      percentiles-histogram:
        http.server.requests: true
