name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # compile (-Werror) -> unit tests + module boundary check (surefire)
      # -> integration tests against PostgreSQL in Testcontainers (failsafe; Docker is available on the runner)
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Build only; pushing to a registry is introduced with deployment (P16).
      - name: Build image
        run: docker build --tag storeforge:${{ github.sha }} .
