# Local development dependencies. `docker compose up -d` starts what the app needs;
# `docker compose --profile app up -d --build` also runs the app itself in a container.
# Later phases add services (mailpit, otel-lgtm, redis...) behind their own profiles.
name: storeforge

services:
  postgres:
    image: postgres:17
    # pg_stat_statements: per-statement timing, the first stop when anything is slow (P15).
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              "-c", "track_io_timing=on"]
    environment:
      POSTGRES_DB: storeforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev}
      STOREFORGE_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-storeforge_owner_dev}
      STOREFORGE_APP_PASSWORD: ${DB_APP_PASSWORD:-storeforge_app_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d storeforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing email locally. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  # Shared state for rate limits and usage counters across app instances (P12). No persistence:
  # everything in it is either recomputable or acceptable to lose (see ADR-020).
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-ttl"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for product images (P13, ADR-024). S3 API: http://localhost:8333.
  # Credentials in infra/seaweedfs/s3.json (local development only).
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-volume.max=0", "-master.volumeSizeLimitMB=64"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - seaweedfs-data:/data

  # OpenTelemetry Collector + Prometheus + Tempo + Loki + Grafana in one container (dev only).
  # Grafana: http://localhost:3000 (admin/admin). The app ships OTLP to 4318 with SPRING_PROFILES_ACTIVE=otel.
  otel-lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.35.0
    ports:
      - "3000:3000"                # Grafana
      - "4317:4317"                # OTLP gRPC
      - "4318:4318"                # OTLP HTTP
      - "127.0.0.1:9090:9090"      # Prometheus API (debugging queries)
      - "127.0.0.1:3200:3200"      # Tempo API
      - "127.0.0.1:3100:3100"      # Loki API
    volumes:
      - ./infra/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/storeforge.yaml:ro
      - ./infra/grafana/dashboards:/otel-lgtm/storeforge-dashboards:ro

  app:
    profiles: ["app"]
    build: .
    # Hardened like production should be: nothing in the image is writable, no Linux capabilities,
    # no privilege escalation (setuid). The JVM only needs /tmp.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/storeforge
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-storeforge_owner_dev}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-storeforge_app_dev}
      ENVIRONMENT: docker
      MAIL_HOST: mailpit
      REDIS_URL: redis://redis:6379
      STORAGE_ENDPOINT: http://seaweedfs:8333
      # Requests from the host arrive through the Docker bridge; trust it to forward X-Forwarded-* (LOCAL ONLY:
      # in production this is the load balancer's address range, never a range clients can reach directly).
      TRUSTED_PROXIES: 127.0.0.0/8, ::1/128, 172.16.0.0/12
      STORAGE_PUBLIC_ENDPOINT: http://localhost:8333   # presigned URLs are opened by clients outside Compose
      # With "--profile observability" too, telemetry goes to the otel-lgtm container.
      SPRING_PROFILES_ACTIVE: ${APP_PROFILES:-default}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
