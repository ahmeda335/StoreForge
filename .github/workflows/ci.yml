name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party code in CI is pinned to a commit (actions) or an exact image version (scanners):
# a moved tag can't change what runs here. Dependabot proposes the bumps (.github/dependabot.yml).

jobs:
  verify:
    name: Build, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # compile (-Werror) -> unit tests + module boundary check (surefire)
      # -> integration tests against PostgreSQL, Redis and SeaweedFS in Testcontainers (failsafe)
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Keep the SBOM of this build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: target/classes/META-INF/sbom/application.cdx.json
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Exceptions live in .gitleaks.toml, each with a reason.
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1 git /repo --no-banner --redact --exit-code 1

  image:
    name: Docker image builds and has no fixable HIGH/CRITICAL vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Build only; pushing to a registry is introduced with deployment (P16).
      - name: Build image
        run: docker build --tag storeforge:${{ github.sha }} .
      # Gate: HIGH/CRITICAL with a fix available fails the build. Accepted risks go in .trivyignore with
      # a reason and an expiry date (none today). Unfixed ones are reported, not blocking.
      - name: Scan image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
            aquasec/trivy:0.74.0 image --timeout 20m --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore \
            --exit-code 1 storeforge:${{ github.sha }}

  slo-rules:
    name: SLO alert rules are valid and fire when they should (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/infra/prometheus:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.14.0 check rules slo-rules.yml
          docker run --rm -v "$PWD/infra/prometheus:/rules:ro" -w /rules --entrypoint promtool prom/prometheus:v3.14.0 test rules slo-rules.test.yml
